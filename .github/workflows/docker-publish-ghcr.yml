name: Docker Image CI for GHCR

on:
  push:
    branches: [ "master" ] # 触发分支为 master
  pull_request:
    branches: [ "master" ] # 可选：在 PR 到 master 分支时也构建

jobs:
  build_and_push_to_ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 需要写入 GitHub Packages (GHCR) 的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' # 只在非 PR 事件时登录和推送
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # 使用触发 workflow 的用户作为用户名
          password: ${{ secrets.GITHUB_TOKEN }} # 使用 GITHUB_TOKEN 进行认证

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }} # 只在非 PR 事件时推送
          tags: |
            ghcr.io/mydracula/solid-bata2:latest
            ghcr.io/mydracula/solid-bata2:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max